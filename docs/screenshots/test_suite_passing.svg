<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="800" height="340" rx="12" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Terminal Header -->
  <rect width="800" height="42" rx="12" fill="#161E2E"/>
  <rect y="30" width="800" height="12" fill="#161E2E"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1F2937" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="24" cy="21" r="6" fill="#EF4444" />
  <circle cx="44" cy="21" r="6" fill="#F59E0B" />
  <circle cx="64" cy="21" r="6" fill="#10B981" />

  <text x="400" y="26" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">terminal &amp;mdash; vitest run</text>

  <!-- Terminal Body Content -->
  <g font-family="'JetBrains Mono', monospace" font-size="13">
    <!-- Command Line -->
    <text x="32" y="76" fill="#6B7280">$</text>
    <text x="48" y="76" fill="#E5E7EB">npm test</text>

    <text x="32" y="104" fill="#9CA3AF">&gt; whistle@1.0.0 test</text>
    <text x="32" y="124" fill="#9CA3AF">&gt; vitest run</text>

    <!-- Test Run Header -->
    <rect x="32" y="146" width="46" height="20" rx="4" fill="#065F46" />
    <text x="41" y="160" fill="#34D399" font-weight="bold" font-size="11">RUN</text>
    <text x="88" y="160" fill="#9CA3AF">v2.1.9 C:/Users/rahul/.gemini/antigravity/scratch/Whistle</text>

    <!-- Tests Passing Line -->
    <text x="32" y="196" fill="#10B981" font-weight="bold">&#10003;</text>
    <text x="48" y="196" fill="#E5E7EB">tests/Whistle.test.ts</text>
    <text x="235" y="196" fill="#10B981">(7 tests)</text>
    <text x="310" y="196" fill="#6B7280">28ms</text>

    <!-- Summary Box -->
    <line x1="32" y1="216" x2="768" y2="216" stroke="#1F2937" stroke-width="1" />

    <text x="32" y="244" fill="#9CA3AF">Test Files</text>
    <text x="130" y="244" fill="#10B981" font-weight="bold">1 passed</text>
    <text x="210" y="244" fill="#6B7280">(1)</text>

    <text x="32" y="268" fill="#9CA3AF">Tests</text>
    <text x="130" y="268" fill="#10B981" font-weight="bold">7 passed</text>
    <text x="210" y="268" fill="#6B7280">(7)</text>

    <text x="32" y="292" fill="#9CA3AF">Duration</text>
    <text x="130" y="292" fill="#E5E7EB">1.70s</text>

    <!-- Passing Badge in Corner -->
    <rect x="660" y="246" width="105" height="32" rx="6" fill="#065F46" stroke="#059669" stroke-width="1"/>
    <text x="712" y="266" fill="#6EE7B7" font-weight="bold" font-size="12" text-anchor="middle">&#10003; ALL PASS</text>
  </g>
</svg>